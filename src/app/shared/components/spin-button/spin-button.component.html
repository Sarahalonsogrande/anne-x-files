<!--
    SpinButtonComponent
    --------------------
    - Action button that shows an icon (or image) and performs a spin animation.
    - Works with modes, moods, language options or any custom option set.
    - Accessible: `ariaLabel` input describe the action for screen readers, translated (i18n, via ngx-translate).
    - Icon or image updates dynamically based on the current value.
-->

<!-- Main spin button for switching options -->
<button
    type="button"
    class="spin-btn"
    (click)="onSwitch()"
    [class.rotating]="isRotating()"
    [class.rotate-next]="rotationDirection() === 'next'"
    [class.rotate-prev]="rotationDirection() === 'prev'"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-pressed]="ariaPressed()"
>
    <!-- Icon wrapper triggers spin animation -->
    <span class="icon-wrapper">
        <!-- #iconElement: Reference for triggering spin animation on icon -->
        <span class="icon" #iconElement (animationend)="onAnimationEnd()">
            @if (value(); as option) {
                <!-- Show image if option.img exists -->
                @if (option.img) {
                    <img [src]="option.img" width="24" height="24" alt="" aria-hidden="true" />
                } @else if (option.icon) {
                    <!-- Show emoji/icon if option.icon exists -->
                    <span aria-hidden="true">{{ option.icon }}</span>
                } @else {
                    <!-- Option has no icon/img: use configured defaultIcon when provided, otherwise SVG -->
                    @if (defaultIcon()) {
                        <span aria-hidden="true">{{ defaultIcon() }}</span>
                    } @else {
                        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none" />
                            <path d="M8 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                        </svg>
                    }
                }
            }
        </span>
    </span>
</button>

<!-- Live region to announce changes for screen readers -->
<span aria-live="polite" role="status" class="visually-hidden">{{ announcerText() }}</span>
